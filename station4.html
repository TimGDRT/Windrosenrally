<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Windrosen-Rallye – Station 4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap">
<style>
  :root { --paper:#FBF6EC; --card:#FFFFFF; --ink:#1F2A36; --muted:#5B6470; --sand:#EBCB9C; --green:#3E8E41; --red:#C0392B; --line:#D9CBB0;
          --font:"Andika","Trebuchet MS","Segoe UI",Arial,sans-serif; color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; background:var(--paper); color:var(--ink); font-family:var(--font);
         padding:20px max(16px, env(safe-area-inset-right)) 20px max(16px, env(safe-area-inset-left));
         display:flex; justify-content:center; align-items:flex-start; }
  .card { width:100%; max-width:640px; background:var(--card); border:3px solid var(--ink); border-radius:18px;
          padding:24px 22px 22px; display:grid; gap:18px; box-shadow:0 6px 0 var(--sand); }
  .top { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
  .eyebrow { font-size:1.05rem; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); font-weight:700; }
  .station { font-size:1rem; color:var(--muted); }
  .letterrow { display:flex; align-items:center; gap:22px; flex-wrap:wrap; }
  .letter { font-size:clamp(5rem,22vw,8rem); font-weight:700; line-height:1; width:1.35em; height:1.35em; display:grid; place-items:center;
            background:#FFF3B0; border:3px solid #8A6D00; border-radius:16px; color:#5A4500; }
  .letterlabel { font-size:1.35rem; line-height:1.35; flex:1 1 200px; min-width:0; }
  .letterlabel b { display:block; font-size:1.6rem; }
  .hint { border-top:2px dashed var(--line); padding-top:16px; display:grid; grid-template-columns:1fr auto; gap:16px; align-items:center; }
  .hint h2 { margin:0 0 6px; font-size:1.1rem; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; }
  .hint p { margin:0; font-size:clamp(1.35rem,5vw,1.7rem); line-height:1.4; }
  .dir { color:var(--red); font-weight:700; }
  svg.rose { width:130px; height:130px; }
  .done { background:#E7F3E1; border:2px solid var(--green); border-radius:12px; padding:12px 14px; font-size:1.15rem; line-height:1.4; }
  .start p { font-size:1.4rem; line-height:1.45; margin:0; }
  @media (max-width:480px) { .hint { grid-template-columns:1fr; } svg.rose { justify-self:center; } }
</style>
</head>
<body>
<main class="card">
  <div class="top"><span class="eyebrow">Windrosen-Rallye</span><span class="station">Station 4</span></div>
  <div class="letterrow">
    <div class="letter" aria-label="Buchstabe T">T</div>
    <div class="letterlabel"><b>Euer Buchstabe</b>Schreibt ihn auf euren Laufzettel.</div>
  </div>
  <section class="hint">
    <div><h2>Nächster Hinweis</h2><p>Geht nach <span class="dir">OSTEN</span> </p></div>
    <svg class="rose" viewBox="0 0 130 132" role="img" aria-label="Windrose, Richtung O markiert"><polygon points="65.0,13.0 56.0,65.0 65,65" fill="#3A3F45"/><polygon points="65.0,13.0 74.0,65.0 65,65" fill="#D2A85A"/><polygon points="89.0,41.0 58.6,58.6 65,65" fill="#3A3F45"/><polygon points="89.0,41.0 71.4,71.4 65,65" fill="#D2A85A"/><polygon points="117.0,65.0 65.0,56.0 65,65" fill="#C0392B"/><polygon points="117.0,65.0 65.0,74.0 65,65" fill="#E8806F"/><polygon points="89.0,89.0 71.4,58.6 65,65" fill="#3A3F45"/><polygon points="89.0,89.0 58.6,71.4 65,65" fill="#D2A85A"/><polygon points="65.0,117.0 74.0,65.0 65,65" fill="#3A3F45"/><polygon points="65.0,117.0 56.0,65.0 65,65" fill="#D2A85A"/><polygon points="41.0,89.0 71.4,71.4 65,65" fill="#3A3F45"/><polygon points="41.0,89.0 58.6,58.6 65,65" fill="#D2A85A"/><polygon points="13.0,65.0 65.0,74.0 65,65" fill="#3A3F45"/><polygon points="13.0,65.0 65.0,56.0 65,65" fill="#D2A85A"/><polygon points="41.0,41.0 58.6,71.4 65,65" fill="#3A3F45"/><polygon points="41.0,41.0 71.4,58.6 65,65" fill="#D2A85A"/><text x="65" y="9" text-anchor="middle" font-weight="700" font-size="13" fill="#1F2A36">N</text><text x="123" y="69" text-anchor="middle" font-weight="700" font-size="13" fill="#1F2A36">O</text><text x="65" y="127" text-anchor="middle" font-weight="700" font-size="13" fill="#1F2A36">S</text><text x="7" y="69" text-anchor="middle" font-weight="700" font-size="13" fill="#1F2A36">W</text></svg>
  </section>
  <div class="done">Seid ihr wieder an eurer Startstation? Dann seid ihr fertig! Setzt euch leise an euren Platz und bildet das Lösungswort.</div>
</main>
</body>
</html>
